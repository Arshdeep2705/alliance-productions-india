<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e0a"/>
      <stop offset="55%" stop-color="#0f3520"/>
      <stop offset="100%" stop-color="#040805"/>
    </linearGradient>
    <radialGradient id="g3r" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(117,189,69,.42)"/>
      <stop offset="60%" stop-color="rgba(117,189,69,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#g3)"/>
  <rect width="800" height="1200" fill="url(#g3r)"/>
  <!-- Continents silhouette / horizon line -->
  <path d="M 0 880 Q 200 850 400 870 T 800 880 L 800 1200 L 0 1200 Z" fill="rgba(0,0,0,.5)"/>
  <!-- API emblem -->
  <g transform="translate(400 270)" opacity=".22">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="180" fill="#75bd45" letter-spacing="-8">API</text>
  </g>
  <!-- Eyebrow -->
  <text x="400" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" letter-spacing="8" fill="#75bd45">AN INTERNATIONAL FEATURE</text>
  <!-- Title -->
  <text x="400" y="640" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-weight="500" font-size="80" fill="#eef4e6">Australia</text>
  <text x="400" y="730" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-style="italic" font-weight="400" font-size="44" fill="#c5d8b0">a true story</text>
  <!-- Divider -->
  <line x1="340" y1="790" x2="460" y2="790" stroke="#75bd45" stroke-width="1.5"/>
  <!-- Status -->
  <text x="400" y="840" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" letter-spacing="6" fill="#a8c490">PRE-PRODUCTION · 2025–26</text>
  <!-- Co-prod note -->
  <text x="400" y="880" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="4" fill="#7a9670">INDIA × AUSTRALIA</text>
  <!-- Studio -->
  <text x="400" y="1100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#867253">ALLIANCE PRODUCTIONS INDIA LLP</text>
</svg>
