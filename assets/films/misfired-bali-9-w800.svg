<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="55%" stop-color="#2a0c14"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="g2r" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(220,40,40,.32)"/>
      <stop offset="60%" stop-color="rgba(220,40,40,0)"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1200" fill="url(#g2)"/>
  <rect width="800" height="1200" fill="url(#grid)"/>
  <rect width="800" height="1200" fill="url(#g2r)"/>
  <!-- API emblem -->
  <g transform="translate(400 280)" opacity=".22">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="180" fill="#75bd45" letter-spacing="-8">API</text>
  </g>
  <!-- "9" massive backdrop -->
  <text x="400" y="900" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="600" fill="rgba(220,40,40,.07)" letter-spacing="-30">9</text>
  <!-- Title -->
  <text x="400" y="640" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-weight="600" font-size="78" fill="#f4eee2">MISFIRED</text>
  <line x1="280" y1="690" x2="520" y2="690" stroke="#dc2828" stroke-width="2"/>
  <text x="400" y="760" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="600" letter-spacing="14" fill="#dc6868">BALI · 9</text>
  <!-- Status -->
  <text x="400" y="850" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" letter-spacing="6" fill="#a89070">A TRUE-CRIME DRAMA · IN DEVELOPMENT</text>
  <!-- Studio -->
  <text x="400" y="1100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#867253">ALLIANCE PRODUCTIONS INDIA LLP</text>
</svg>
