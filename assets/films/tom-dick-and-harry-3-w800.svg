<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="g1r" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="rgba(242,155,25,.45)"/>
      <stop offset="60%" stop-color="rgba(242,155,25,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#g1)"/>
  <rect width="800" height="1200" fill="url(#g1r)"/>
  <!-- API emblem (simplified) -->
  <g transform="translate(400 280)" opacity=".22">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="180" fill="#75bd45" letter-spacing="-8">API</text>
  </g>
  <!-- Title -->
  <text x="400" y="630" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-style="italic" font-weight="500" font-size="64" fill="#f5e6c8">Tom, Dick</text>
  <text x="400" y="700" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-style="italic" font-weight="500" font-size="64" fill="#f5e6c8">&amp; Mary</text>
  <!-- Divider -->
  <line x1="320" y1="760" x2="480" y2="760" stroke="#f29b19" stroke-width="2"/>
  <!-- Sub -->
  <text x="400" y="815" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" letter-spacing="6" fill="#dcc8a4">A COMEDY · IN DEVELOPMENT</text>
  <!-- Director -->
  <text x="400" y="1060" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" letter-spacing="4" fill="#a89770">A FILM BY DEEPAK TIJORI</text>
  <text x="400" y="1100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#867253">ALLIANCE PRODUCTIONS INDIA LLP</text>
</svg>
