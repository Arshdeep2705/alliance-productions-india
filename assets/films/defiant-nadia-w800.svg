<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#3a1418"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="dn-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="rgba(216,173,85,.28)"/>
      <stop offset="60%" stop-color="rgba(216,173,85,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#dn-bg)"/>
  <rect width="800" height="1200" fill="url(#dn-glow)"/>

  <!-- API emblem -->
  <g transform="translate(400 280)" opacity=".18">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="180" fill="#75bd45" letter-spacing="-8">API</text>
  </g>

  <!-- Eyebrow -->
  <text x="400" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" letter-spacing="10" fill="#d8ad55">A NATIONAL FEATURE</text>

  <!-- Title -->
  <text x="400" y="660" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-weight="500" font-style="italic" font-size="48" fill="#dcc5a0">Defiant</text>
  <text x="400" y="740" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-weight="600" font-size="92" fill="#f4eee2">Nadia</text>

  <!-- Divider -->
  <line x1="340" y1="790" x2="460" y2="790" stroke="#d8ad55" stroke-width="1.5"/>

  <!-- Status -->
  <text x="400" y="840" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" letter-spacing="6" fill="#a89770">IN DEVELOPMENT</text>

  <!-- Studio -->
  <text x="400" y="1100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#867253">ALLIANCE PRODUCTIONS INDIA LLP</text>
</svg>
