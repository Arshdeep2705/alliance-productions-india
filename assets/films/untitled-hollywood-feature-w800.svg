<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="g4r" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="rgba(216,173,85,.28)"/>
      <stop offset="60%" stop-color="rgba(216,173,85,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#g4)"/>
  <rect width="800" height="1200" fill="url(#g4r)"/>

  <!-- API emblem -->
  <g transform="translate(400 280)" opacity=".18">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black',sans-serif" font-weight="900" font-size="180" fill="#75bd45" letter-spacing="-8">API</text>
  </g>

  <!-- Eyebrow -->
  <text x="400" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" letter-spacing="10" fill="#d8ad55">A HOLLYWOOD FEATURE</text>

  <!-- Title (placeholder) -->
  <text x="400" y="660" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-style="italic" font-weight="400" font-size="56" fill="#e8e0c8">based on</text>
  <text x="400" y="720" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-weight="600" font-size="80" fill="#f4eee2">a true story</text>

  <!-- Divider -->
  <line x1="340" y1="780" x2="460" y2="780" stroke="#d8ad55" stroke-width="1.5"/>

  <!-- Status -->
  <text x="400" y="830" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" letter-spacing="6" fill="#a89770">PRE-PRODUCTION</text>
  <text x="400" y="870" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="4" fill="#7a6a4a">DETAILS TO BE ANNOUNCED</text>

  <!-- Studio -->
  <text x="400" y="1100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" letter-spacing="6" fill="#867253">ALLIANCE PRODUCTIONS INDIA LLP</text>
</svg>
